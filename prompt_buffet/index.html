<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prompt Buffet</title>
    <style>
      :root {
        --bg: #f6f5f2;
        --card: #ffffff;
        --text: #111111;
        --muted: #666666;
        --line: #dddddd;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 56px 20px 72px;
      }
      h1, h2 { margin: 0 0 12px; line-height: 1.25; }
      p { margin: 0 0 14px; }
      .hero, .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 24px;
      }
      .hero { margin-bottom: 18px; }
      .lead { color: var(--muted); max-width: 42rem; }
      .grid {
        display: grid;
        gap: 14px;
        margin-top: 18px;
      }
      .card-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
      a { color: var(--text); }
      ul { margin: 12px 0 0; padding-left: 18px; }
      .meta {
        margin-top: 20px;
        color: var(--muted);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <h1>Prompt Buffet</h1>
        <p class="lead">
          Prompt Buffet 是一個 local-first 的 prompt 收納 app，適合整理常用 prompt、分類管理、快速複製，
          並透過手動備份維持資料可攜性。
        </p>
      </section>

      <section class="grid">
        <article class="card">
          <div class="card-title">這個 app 做什麼</div>
          <p>整理常用 prompt、分類收納、拖曳排序、搜尋，以及快速複製日常會重複使用的文字。</p>
          <ul>
            <li>兩層母子分類</li>
            <li>prompt 釘選與常用整理</li>
            <li>本地垃圾桶與手動備份</li>
          </ul>
        </article>

        <article class="card">
          <div class="card-title">支援與隱私</div>
          <p><a href="./support.html">支援頁</a></p>
          <p><a href="./privacy.html">隱私政策</a></p>
          <p><a href="mailto:zis.tech.support@gmail.com">zis.tech.support@gmail.com</a></p>
        </article>
      </section>

      <p class="meta">Prompt Buffet v1.0.0 · Created by zis_tech</p>
    </main>
  </body>
</html>
